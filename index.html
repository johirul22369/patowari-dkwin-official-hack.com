<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PATOWARI'S HACK - VIP Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050b;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            pointer-events: auto;
        }

        /* ফ্লোটিং আইকন */
        #floating-icon-btn {
            position: fixed;
            top: 40px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
            cursor: move;
            z-index: 9999;
            overflow: hidden;
            touch-action: none;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #floating-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        /* পাসওয়ার্ড পপআপ উইন্ডো */
        #auth-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 270px;
            background: rgba(8, 12, 24, 0.98);
            border: 2px solid #ffd700;
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
            padding: 16px;
            display: none;
            z-index: 10000;
            text-align: center;
        }

        .auth-title {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .auth-input {
            width: 100%;
            padding: 8px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #ffd700;
            border-radius: 8px;
            color: #fff;
            font-size: 11px;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
            font-weight: 800;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 9px;
            color: #cbd5e1;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #error-msg {
            color: #ff3366;
            font-size: 9px;
            margin-top: 6px;
            display: none;
            font-weight: 800;
        }

        /* মূল পপআপ উইন্ডো (সম্পূর্ণ পপআপে ডার্ক ব্লার শ্যাডো সহ) */
        .overlay-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 285px;
            display: none;
            z-index: 9999;
            touch-action: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 18px;
            padding: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 215, 0, 0.35);
            pointer-events: auto;
        }

        .popup-relative-wrapper {
            position: relative;
            width: 100%;
        }

        .popup-main-bg-img {
            width: 100%;
            display: block;
            pointer-events: none;
            border-radius: 12px;
        }

        .close-btn {
            position: absolute;
            top: 6px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px #ef4444;
        }

        /* 🎯 প্রেডিকশন এরিয়া ওপরের দিকে এবং বাম দিকে শিফট করা */
        .center-prediction-area {
            position: absolute;
            top: 122px;
            left: 71.5%;
            transform: translateX(-50%);
            width: 100px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            z-index: 10;
            background: transparent;
        }

        .period-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        /* ✨ রুবি ফন্ট ও আরজিবি (RGB) লাইট অ্যানিমেশন টেক্সট */
        .period-display {
            font-size: 6px;
            font-weight: 900;
            animation: rgbGlowText 3s infinite;
            letter-spacing: 0.1px;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .live-dot {
            width: 3px;
            height: 3px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 5px #22c55e;
            animation: liveBlink 1s infinite alternate;
        }

        @keyframes liveBlink {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .timer-display {
            font-size: 7px;
            font-weight: 900;
            animation: rgbGlowText 2.5s infinite;
            background: rgba(0, 0, 0, 0.75);
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 0.4px;
        }

        /* 🔥 বিগ / স্মল এর জন্য অলটাইম আরজিবি কালার মিক্স গ্লোয়িং ইফেক্ট */
        .solid-big-small {
            font-size: 14px;
            font-weight: 900;
            animation: rgbGlowText 2s infinite;
            letter-spacing: 1.2px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }

        @keyframes rgbGlowText {
            0% { color: #ff3366; text-shadow: 0 0 8px #ff3366, 0 0 15px #ff3366; }
            20% { color: #ff9900; text-shadow: 0 0 8px #ff9900, 0 0 15px #ff9900; }
            40% { color: #ffff00; text-shadow: 0 0 8px #ffff00, 0 0 15px #ffff00; }
            60% { color: #00ff88; text-shadow: 0 0 8px #00ff88, 0 0 15px #00ff88; }
            80% { color: #00ffff; text-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff; }
            100% { color: #da70d6; text-shadow: 0 0 8px #da70d6, 0 0 15px #da70d6; }
        }

        .official-num-badge {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .bg-red { background: linear-gradient(135deg, #ef4444, #991b1b); border: 1.5px solid #fca5a5; }
        .bg-green { background: linear-gradient(135deg, #22c55e, #15803d); border: 1.5px solid #86efac; }
        .bg-violet { background: linear-gradient(135deg, #a855f7, #6b21a8); border: 1.5px solid #d8b4fe; }

        /* 🎯 টেলিগ্রাম লোগো বাটন পপআপের ভেতরে নির্দিষ্ট স্থানে সেট করা */
        .bottom-action-bar {
            margin-top: 6px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 25;
        }

        .telegram-join-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 9px;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 215, 0, 0.6);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        #copy-toast {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: #fff;
            font-size: 7px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 3px;
            display: none;
            z-index: 30;
        }
    </style>
</head>
<body>

    <!-- DKWIN গেম রেফারেল লিংক iframe -->
    <iframe id="game-iframe" src="https://dkwin9.com/#/register?invitationCode=932152417441" loading="lazy" style="pointer-events: auto;"></iframe>

    <!-- ফ্লোটিং আইকন -->
    <div id="floating-icon-btn" onclick="handleIconClick()">
        <img src="https://cdn.imageurlgenerator.com/uploads/5f242846-c36b-4437-8bbd-8fab060a831d.jpg" alt="Patowari Icon">
    </div>

    <!-- পাসওয়ার্ড পপআপ -->
    <div id="auth-overlay">
        <div class="auth-title">🔐 PATOWARI'S HACK</div>
        <input type="password" id="pass-input" class="auth-input" placeholder="Enter Password">
        <label class="remember-row">
            <input type="checkbox" id="remember-pass"> Remember Password
        </label>
        <button class="auth-btn" onclick="checkPassword()">Submit</button>
        <div id="error-msg">Wrong Password!</div>
    </div>

    <!-- মূল পপআপ উইন্ডো (সম্পূর্ণ বক্সে শ্যাডো সহ) -->
    <div class="overlay-box" id="main-content">
        <div class="popup-relative-wrapper">
            <button class="close-btn" onclick="hidePopup()">×</button>

            <!-- পপআপ ব্যাকগ্রাউন্ড ইমেজ -->
            <img src="https://cdn.imageurlgenerator.com/uploads/de9a0e87-0c16-4ecf-8e65-14f1fc9e3d98.png" alt="VIP Popup" class="popup-main-bg-img">

            <!-- ডান দিকের ফ্রেমে পিরিয়ড ও সিগন্যাল এরিয়া -->
            <div class="center-prediction-area">
                <div class="period-container">
                    <div class="period-display" id="period-num" onclick="copyPeriodNumber()" title="Click to Copy Period">Loading...</div>
                    <div class="live-dot"></div>
                </div>
                <!-- ৩০ সেকেন্ডের লাইভ টাইমার -->
                <div class="timer-display" id="timer-display">TIME: 30s</div>
                <div class="solid-big-small" id="res-size">WAITING...</div>
                <div class="official-num-badge bg-green" id="official-num" style="display: none;">7</div>
            </div>
            <div id="copy-toast">Copied!</div>
        </div>

        <!-- টেলিগ্রাম লোগো বাটন পপআপ ইমেজের ভেতরে নির্দিষ্ট স্থানে সেট করা -->
        <div class="bottom-action-bar">
            <a href="https://t.me/patowari_vai_69x" target="_blank" class="telegram-join-btn">
                <!-- অফিশিয়াল টেলিগ্রাম এসভিজি লোগো -->
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.442-752-.244-1.349-.374-1.297-.789.027-.216.324-.437.893-.663 3.498-1.524 5.83-2.529 6.996-3.014 3.333-1.386 4.025-1.627 4.479-1.635.099-.002.321.023.465.14.12.098.153.228.166.32.013.092.028.301.012.463z" fill="#000"/>
                </svg>
                JOIN TELEGRAM
            </a>
        </div>
    </div>

    <script>
        let isUnlocked = localStorage.getItem("patowari_hack_unlocked") === "true";
        let cachedPeriod = "";
        let cachedPrediction = { type: "BIG", num: 7 };

        function handleIconClick() {
            if (isUnlocked) {
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('auth-overlay').style.display = 'block';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            const rememberMe = document.getElementById('remember-pass').checked;

            if (pass === "PATOWARI69") {
                isUnlocked = true;
                if (rememberMe) {
                    localStorage.setItem("patowari_hack_unlocked", "true");
                }
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('floating-icon-btn').style.display = 'none';
                startPeriodGenerator();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        function hidePopup() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('floating-icon-btn').style.display = 'flex';
        }

        function startPeriodGenerator() {
            updateSignalLogic();
            setInterval(updateSignalLogic, 1000);
        }

        function copyPeriodNumber() {
            const periodText = document.getElementById('period-num').innerText.replace("Period: ", "");
            if (periodText && periodText !== "Loading...") {
                navigator.clipboard.writeText(periodText).then(() => {
                    let toast = document.getElementById('copy-toast');
                    toast.style.display = 'block';
                    setTimeout(() => {
                        toast.style.display = 'none';
                    }, 1200);
                });
            }
        }

        // WinGo 30 Seconds Fixed Signal Engine
        function updateSignalLogic() {
            if (!isUnlocked) return;

            const now = new Date();
            const duration = 30; // 30s Fixed

            const totalSecondsToday = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
            let elapsedInPeriod = totalSecondsToday % duration; 
            let periodIndexToday = Math.floor(totalSecondsToday / duration) + 1;
            
            let dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, '0')}${String(now.getUTCDate()).padStart(2, '0')}`;
            let formattedIndex = String(50000 + periodIndexToday).padStart(5, '0');
            let fullPeriod = `Period: ${dateStr}1000${formattedIndex}`;
            
            let timeLeft = duration - elapsedInPeriod;

            document.getElementById('period-num').innerText = fullPeriod;
            document.getElementById('timer-display').innerText = `TIME: ${timeLeft < 10 ? '0' + timeLeft : timeLeft}s`;

            let sizeEl = document.getElementById('res-size');
            let numEl = document.getElementById('official-num');
            
            if (fullPeriod !== cachedPeriod) {
                cachedPeriod = fullPeriod;
                let rawPeriodNum = fullPeriod.replace("Period: ", "");
                let seedVal = parseInt(rawPeriodNum.slice(-5)) || 12345;
                let marketFlowTrend = (seedVal * 31 + Math.floor(Date.now() / 30000)) % 100;
                
                let isBig = marketFlowTrend >= 46;
                let predType = isBig ? "BIG" : "SMALL";

                let luckyNum;
                if (isBig) {
                    luckyNum = 5 + ((seedVal + marketFlowTrend) % 5);
                } else {
                    luckyNum = (seedVal + marketFlowTrend) % 5;
                }

                cachedPrediction = { type: predType, num: luckyNum };
            }

            if (timeLeft >= 28) {
                sizeEl.innerText = "WAITING...";
                sizeEl.style.fontSize = "9.5px";
                numEl.style.display = "none";
            } else {
                sizeEl.style.fontSize = "14px";
                sizeEl.innerText = cachedPrediction.type;

                let luckyNum = cachedPrediction.num;
                numEl.innerText = luckyNum;
                numEl.className = "official-num-badge";

                if (luckyNum === 0 || luckyNum === 5) {
                    numEl.classList.add("bg-violet");
                } else if (luckyNum === 1 || luckyNum === 3 || luckyNum === 7 || luckyNum === 9) {
                    numEl.classList.add("bg-green");
                } else {
                    numEl.classList.add("bg-red");
                }

                numEl.style.display = "flex";
            }
        }

        makeDraggable(document.getElementById("floating-icon-btn"));
        makeDraggable(document.getElementById("main-content"));

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let header = document.getElementById(elmnt.id + "-header") || elmnt;
            
            header.onmousedown = dragMouseDown;
            header.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
                pos3 = clientX;
                pos4 = clientY;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.ontouchend = null;
                document.onmousemove = null;
                document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
